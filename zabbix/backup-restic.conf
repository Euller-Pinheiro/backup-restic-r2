# Zabbix Agent 2 / Agent — copiar para /etc/zabbix/zabbix_agent2.d/ (ou zabbix_agentd.d/)
# e reiniciar o agente. O usuário zabbix precisa ler /var/lib/backup-restic/ (o install.sh já ajusta).
#
# backup.restic.age  -> segundos desde o último backup BEM-SUCEDIDO (999999999 se nunca rodou)
# backup.restic.check.age -> segundos desde a última verificação OK do repositório
UserParameter=backup.restic.age,f=/var/lib/backup-restic/last-success; if [ -r "$f" ]; then echo $(( $(date +%s) - $(cat "$f") )); else echo 999999999; fi
UserParameter=backup.restic.check.age,f=/var/lib/backup-restic/last-check; if [ -r "$f" ]; then echo $(( $(date +%s) - $(cat "$f") )); else echo 999999999; fi
